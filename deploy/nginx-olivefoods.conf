# Olive Foods — nginx site config for a single-page (Vite/React) static site.
# Install: see deploy/SERVER_SETUP.md. certbot will add the HTTPS (443) block
# and the HTTP→HTTPS redirect automatically when you run it.

server {
    listen 80;
    listen [::]:80;
    server_name olivefoods.lk www.olivefoods.lk;

    root /var/www/olivefoods;
    index index.html;

    # Routing: serve a prerendered per-route file when one exists
    # (dist/about/index.html, dist/products/index.html, …), otherwise fall
    # back to the SPA shell. `$uri/index.html` targets the file inside a route
    # folder directly — never a bare directory — so a route folder can't 403.
    location / {
        try_files $uri $uri/index.html /200.html;
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Compress text assets on the fly.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # A little hardening.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
