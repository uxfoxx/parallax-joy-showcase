# Olive Foods — nginx site config for a single-page (Vite/React) static site.
# Install: see deploy/SERVER_SETUP.md. certbot will add the HTTPS (443) block
# and the HTTP→HTTPS redirect automatically when you run it.

server {
    listen 80;
    listen [::]:80;
    server_name olivefoods.lk www.olivefoods.lk;

    root /var/www/olivefoods;
    index index.html;

    # SPA routing: unknown paths fall back to index.html so React Router works
    # (e.g. /profile/afrid-rahuman, /about) instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell, so new deploys show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Compress text assets on the fly.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # A little hardening.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
