# ─────────────────────────────────────────────────────────────────────────────
# Olive Foods — olivefoods.lk + www.olivefoods.lk
#
# THIS FILE IS THE SOURCE OF TRUTH. scripts/deploy.sh ships it to
# /srv/olivefoods/nginx.conf and `sudo reload-site-nginx olivefoods` installs it
# as /etc/nginx/conf.d/10-olivefoods.conf. Do not hand-edit the server copy --
# it used to drift from this file by 29 lines and nobody could tell which was live.
#
# The numeric prefix pins load order. It used to be alphabetical by accident,
# which is how bandittheory.conf silently became the default vhost for the box.
#
# www is canonical (every page's <link rel="canonical"> points at www). The bare
# domain and plain HTTP 301 straight to https://www in one hop, and /page/ 301s
# to /page, so every page has exactly one address for search engines. One
# Let's Encrypt cert covers both names.
# NOTE: the bare @ record still round-robins with a dead old IP at the registry,
# so some bare-domain visitors see a delay before their browser fails over here.
#
# The site is served by its own sirv process on 127.0.0.1:4001 (see
# deploy/ecosystem.config.cjs). nginx keeps ownership of caching and security
# headers: sirv's Cache-Control is hidden and replaced per location below.
#
# REMOVED in the isolation work: a `server_name 159.198.45.242` block that served
# this site on the raw IP "for testing". One project answering for a host that
# isn't its own is the cross-wiring this work exists to eliminate; the raw IP is
# now dropped by conf.d/00-default.conf.
# ─────────────────────────────────────────────────────────────────────────────

# ── bare + www over HTTP → https://www in one hop ──
server {
    listen 80;
    listen [::]:80;
    server_name olivefoods.lk www.olivefoods.lk;

    access_log /var/log/nginx/olivefoods.access.log main;
    error_log  /var/log/nginx/olivefoods.error.log;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://www.olivefoods.lk$request_uri; }
}

# ── bare over HTTPS → the canonical www host ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name olivefoods.lk;

    access_log /var/log/nginx/olivefoods.access.log main;
    error_log  /var/log/nginx/olivefoods.error.log;

    ssl_certificate     /etc/letsencrypt/live/www.olivefoods.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.olivefoods.lk/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://www.olivefoods.lk$request_uri; }
}

# ── www over HTTPS — proxies to this project's own static server ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.olivefoods.lk;

    access_log /var/log/nginx/olivefoods.access.log main;
    error_log  /var/log/nginx/olivefoods.error.log;

    ssl_certificate     /etc/letsencrypt/live/www.olivefoods.lk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.olivefoods.lk/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }

    # One address per page: /about/ → /about. Prerendered pages are stored as
    # <page>/index.html, so without this each page also answers at /<page>/.
    location ~ ^(/.+)/$ {
        return 301 https://www.olivefoods.lk$1$is_args$args;
    }

    # Dotfiles (/.env, /.git/…) are never pages. Scanners probe them all day;
    # without this sirv's SPA fallback answered them 200. ACME is unaffected:
    # its ^~ prefix above is matched before any regex.
    location ~ /\. { return 404; }

    # The homepage has one address: "/".
    location = /index.html { return 301 https://www.olivefoods.lk/; }
    # The SPA fallback shell (no title, no canonical). sirv reads it from disk
    # for unknown routes; it must never be fetched or indexed on its own.
    location = /200.html { return 404; }

    # While the app restarts during a deploy (`pm2 reload`, a second or so),
    # answer 503 + Retry-After instead of nginx's 502. Search engines treat a
    # 503 as "temporarily unavailable, retry later" rather than a server error
    # on the page.
    error_page 502 504 =503 @olivefoods_restarting;
    location @olivefoods_restarting {
        add_header Retry-After "30" always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 503 "Olive Foods is updating. Please try again in a moment.\n";
    }

    # Not a page on this site → a real 404, with the site's own "Page not found"
    # screen as the body (the app shell renders it). Before this, sirv's SPA
    # fallback answered EVERY unknown URL with 200, which Google files under
    # "Soft 404". Without the `=`, error_page keeps the 404 status even though
    # the shell itself is fetched with a 200.
    error_page 404 @olivefoods_notfound;
    location @olivefoods_notfound {
        rewrite ^ /200.html break;
        proxy_pass http://127.0.0.1:4001;
        include /etc/nginx/snippets/proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fingerprinted build output — the URL changes whenever the bytes do, so it
    # can be cached forever. One Cache-Control, not two: `expires` emits its own
    # header, so pairing it with add_header sends the directive twice.
    # ^~ so the file-extension regex below never takes these over.
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:4001;
        include /etc/nginx/snippets/proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The routes the app has (src/App.tsx) — HTML pages and the SPA fallback.
    # Must revalidate every time or a deploy would be invisible to returning
    # visitors. KEEP IN STEP WITH src/App.tsx: the build fails if a route there
    # isn't matched here (scripts/seo/build-sitemap.mjs, "nginx route check").
    # Case-insensitive like React Router, so /About still reaches the About
    # page (whose canonical is /about). Query strings don't affect matching.
    #
    # Catalogue pages (/products/x, /brands/x, …) stay on the SPA fallback even
    # for slugs that don't exist yet: a product added in the admin isn't
    # prerendered until the next deploy and must still work. An unknown slug
    # renders "not found" with a noindex tag, which Google drops quietly.
    #
    # Every add_header is repeated in each location on purpose: nginx does NOT
    # inherit add_header into a location that declares one of its own, so a
    # header set only at server level silently vanishes on these routes.
    location ~* "^/(about|contact|brands|products|categories|site-map|guides|(brands|products|categories|supply|profile|guides)/[^/]+|admin(/[^/]+)*)?$" {
        proxy_pass http://127.0.0.1:4001;
        include /etc/nginx/snippets/proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Sitemaps. sirv labels them text/xml, which the shared proxy snippet's
    # gzip_types doesn't list (a location can't extend that list after including
    # it, and the snippet is shared by every site on the box), so this block
    # sets its own proxy headers and compression. 57 KB → ~6 KB for products.
    location ~ \.xml$ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        gzip            on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_proxied    any;
        gzip_vary       on;
        gzip_types      text/xml application/xml;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Files at the root — robots.txt, the sitemaps, llms.txt, the IndexNow key,
    # the brochure PDF, icons. sirv answers a missing one with a plain 404
    # itself (its SPA fallback skips any path with an extension).
    location ~ "\.[A-Za-z0-9]+$" {
        proxy_pass http://127.0.0.1:4001;
        include /etc/nginx/snippets/proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Anything else is not a page on this site.
    location / {
        return 404;
    }
}
